<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Mini Soccer HORI ke-80 KemenkeuSatu Bontang-Sangatta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(circle at top, #0a2a5e 0%, #041530 60%, #010a18 100%);
    color: #fff;
    min-height: 100vh;
    padding: 16px;
  }

  /* ============ HEADER BANNER ============ */
  .banner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto 22px;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid #d4af37;
    box-shadow: 0 0 40px rgba(212,175,55,0.55), 0 8px 30px rgba(0,0,0,0.6);
    position: relative;
    background: #041530;
  }
  .banner img {
    display: block;
    width: 100%;
    height: auto;
  }
  /* Efek kilau emas di atas banner */
  .banner::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 45%, transparent 60%);
    animation: shine 5s linear infinite;
    pointer-events: none;
  }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .section {
    max-width: 1200px;
    margin: 0 auto 22px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .section h3 {
    color: #f5e07a;
    margin-bottom: 14px;
    font-size: 1.15rem;
    border-left: 4px solid #d4af37;
    padding-left: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ============ LOGO TIM (CROP DARI SATU GAMBAR) ============ */
  .team-logo {
    display: inline-block;
    width: 40px; height: 40px;
    vertical-align: middle;
    border-radius: 8px;
    background-image: var(--logo-src);
    background-repeat: no-repeat;
    /* Nilai default ini menyesuaikan gambar peserta di bagian tengah bawah banner.
       Kalau posisi crop kurang pas, ubah --sx & --sy di bawah.            */
    background-size: var(--logo-bg-size, 900% 900%);
    background-position: var(--sx, 50%) var(--sy, 50%);
    border: 1px solid rgba(212,175,55,0.6);
    box-shadow: 0 0 6px rgba(212,175,55,0.4);
    flex-shrink: 0;
  }
  /* Sesuaikan posisi crop tiap tim (persentase dari gambar) */
  .logo-0 { --sx: 33.5%; --sy: 76%; }   /* Bea Cukai Bontang */
  .logo-1 { --sx: 44.5%; --sy: 76%; }   /* Bea Cukai Sangatta */
  .logo-2 { --sx: 55.5%; --sy: 76%; }   /* Pajak Bontang */
  .logo-3 { --sx: 66.5%; --sy: 76%; }   /* KPKNL Bontang */

  /* ============ TABEL ============ */
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 8px 6px; text-align: center; }
  thead th {
    background: linear-gradient(135deg, #d4af37, #b8912a);
    color: #041530;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
  }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
  tbody tr:hover { background: rgba(212,175,55,0.15); }
  tbody tr:nth-child(1) { background: rgba(212,175,55,0.22); font-weight: 700; }
  tbody tr:nth-child(2) { background: rgba(192,192,192,0.12); }
  tbody tr:nth-child(3) { background: rgba(205,127,50,0.12); }
  .team-name { text-align: left; font-weight: 600; }
  .team-name .team-logo { margin-right: 8px; }
  .pos { font-weight: 800; color: #f5e07a; }

  /* ============ KARTU PERTANDINGAN ============ */
  .match-card {
    background: linear-gradient(135deg, rgba(10,42,94,0.9), rgba(4,21,48,0.9));
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .match-title {
    text-align: center; font-size: 0.8rem; color: #9ecbff;
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
  }
  .score-row {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap;
  }
  .team-box {
    flex: 1 1 30%; text-align: center; font-weight: 700;
    font-size: 0.9rem; min-width: 130px;
  }
  .team-box .team-logo {
    width: 50px; height: 50px; display: block; margin: 0 auto 6px;
  }
  .score-input {
    width: 55px; height: 45px; text-align: center;
    font-size: 1.4rem; font-weight: 800; border-radius: 10px;
    border: 2px solid #d4af37; background: #041530; color: #f5e07a;
  }
  .score-input:focus { outline: none; box-shadow: 0 0 12px #d4af37; }
  .vs { font-size: 1.2rem; color: #d4af37; font-weight: 800; }

  button {
    cursor: pointer; border: none; border-radius: 10px;
    font-weight: 700; transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(212,175,55,0.5); }
  .btn-gold {
    background: linear-gradient(135deg, #d4af37, #f5e07a);
    color: #041530; padding: 8px 14px; font-size: 0.85rem;
  }
  .btn-red {
    background: linear-gradient(135deg, #b02a2a, #e05555);
    color: #fff; padding: 8px 14px; font-size: 0.8rem;
  }
  .btn-sm { padding: 5px 10px; font-size: 0.75rem; }

  .event-area { margin-top: 12px; border-top: 1px dashed rgba(212,175,55,0.4); padding-top: 10px; }
  .event-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .event-row select, .event-row input {
    padding: 7px 8px; border-radius: 8px;
    border: 1px solid rgba(212,175,55,0.5);
    background: #041530; color: #fff; font-size: 0.8rem;
  }
  .event-row input { flex: 1 1 110px; min-width: 90px; }
  .event-row select { flex: 1 1 130px; }
  .event-list { font-size: 0.8rem; color: #cfe3ff; margin-top: 6px; }
  .event-list div { padding: 2px 0; }
  .goal-icon { color: #7CFC00; }
  .assist-icon { color: #FFD700; }

  /* ============ TOP SKOR / ASSIST ============ */
  .top-scorer-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
  }
  .top-scorer-item .rank {
    width: 26px; height: 26px; display: flex; align-items: center;
    justify-content: center; border-radius: 50%;
    background: linear-gradient(135deg, #d4af37, #b8912a);
    color: #041530; font-weight: 800; font-size: 0.8rem; flex-shrink: 0;
  }
  .top-scorer-item .name { flex: 1; font-weight: 600; }
  .top-scorer-item .team { font-size: 0.72rem; color: #9ecbff; display:flex; align-items:center; gap:6px; margin-top:2px;}
  .top-scorer-item .team .team-logo { width: 22px; height: 22px; }
  .top-scorer-item .count { font-weight: 800; color: #f5e07a; font-size: 1.05rem; }

  .footer-note {
    text-align: center; font-size: 0.75rem; color: #7fa5d0;
    margin-top: 10px; max-width: 1200px; margin-left:auto; margin-right:auto;
  }
  .btn-reset-wrap { text-align: center; margin: 10px auto 30px; }
</style>
</head>
<body>

<!-- ===== BANNER RESMI ===== -->
<div class="banner">
  <img src="banner.jpg" alt="Lomba Hari Oeang ke-80 KemenkeuSatu Bontang-Sangatta - Mini Soccer">
</div>

<!-- ===== KLASEMEN ===== -->
<div class="section">
  <h3>📊 Klasemen Liga</h3>
  <table id="klasemen">
    <thead>
      <tr>
        <th>#</th><th class="team-name">Tim</th><th>MP</th><th>M</th><th>S</th><th>K</th>
        <th>GM</th><th>GK</th><th>SG</th><th>Poin</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="footer-note">Urutan: Poin → Selisih Gol → Gol Memasukkan → Head-to-Head → Nama Tim</div>
</div>

<!-- ===== PERTANDINGAN ===== -->
<div class="section">
  <h3>⚽ Pertandingan & Input Skor</h3>
  <div id="matches"></div>
</div>

<!-- ===== TOP SKOR ===== -->
<div class="section">
  <h3>🥇 Top Skor</h3>
  <div class="top-scorer-list" id="topScorers"></div>
</div>

<!-- ===== TOP ASSIST ===== -->
<div class="section">
  <h3>🎯 Top Assist</h3>
  <div class="top-scorer-list" id="topAssists"></div>
</div>

<div class="btn-reset-wrap">
  <button class="btn-red" onclick="resetAll()">🗑️ Reset Semua Data</button>
</div>

<script>
/* ================== DATA DASAR ================== */
const TEAMS = [
  "Bea Cukai Bontang",
  "Bea Cukai Sangatta",
  "Pajak Bontang",
  "KPKNL Bontang"
];

const FIXTURES = [
  [0,1],[2,3],
  [0,2],[1,3],
  [0,3],[1,2]
];

const STORAGE_KEY = "liga_hori80_data";

let state = loadState();

function defaultState() {
  const scores = {};
  const events = {};
  FIXTURES.forEach(([i,j]) => {
    const key = i + "-" + j;
    scores[key] = { a: 0, b: 0, played: false };
    events[key] = [];
  });
  return { scores, events };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    if (!parsed.scores) parsed.scores = base.scores;
    if (!parsed.events) parsed.events = base.events;
    FIXTURES.forEach(([i,j]) => {
      const key = i + "-" + j;
      if (!parsed.scores[key]) parsed.scores[key] = { a:0, b:0, played:false };
      if (!parsed.events[key]) parsed.events[key] = [];
    });
    return parsed;
  } catch(e) { return defaultState(); }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ===== Helper logo tim ===== */
function logoHTML(teamIdx, extraClass = "") {
  return `<span class="team-logo logo-${teamIdx} ${extraClass}"
            style="--logo-src:url('banner.jpg');"></span>`;
}

/* ================== RENDER PERTANDINGAN ================== */
function renderMatches() {
  const container = document.getElementById("matches");
  container.innerHTML = "";

  FIXTURES.forEach(([i,j]) => {
    const key = i + "-" + j;
    const sc = state.scores[key];

    const card = document.createElement("div");
    card.className = "match-card";

    card.innerHTML = `
      <div class="match-title">Pertandingan</div>
      <div class="score-row">
        <div class="team-box">${logoHTML(i)}${TEAMS[i]}</div>
        <input type="number" min="0" class="score-input" id="scoreA-${key}" value="${sc.a}" onchange="updateScore('${key}','a',this.value)">
        <span class="vs">VS</span>
        <input type="number" min="0" class="score-input" id="scoreB-${key}" value="${sc.b}" onchange="updateScore('${key}','b',this.value)">
        <div class="team-box">${logoHTML(j)}${TEAMS[j]}</div>
      </div>

      <div class="event-area">
        <div class="event-row">
          <select id="type-${key}">
            <option value="goal">⚽ Gol</option>
            <option value="assist">🎯 Assist</option>
          </select>
          <select id="team-${key}">
            <option value="${i}">${TEAMS[i]}</option>
            <option value="${j}">${TEAMS[j]}</option>
          </select>
          <input type="text" id="player-${key}" placeholder="Nama pemain">
          <button class="btn-gold btn-sm" onclick="addEvent('${key}')">+ Tambah</button>
        </div>
        <div class="event-list" id="evlist-${key}"></div>
      </div>
    `;
    container.appendChild(card);
    renderEventList(key);
  });
}

function renderEventList(key) {
  const listEl = document.getElementById("evlist-" + key);
  const evs = state.events[key] || [];
  if (evs.length === 0) {
    listEl.innerHTML = '<div style="color:#7fa5d0;">Belum ada pencetak gol/assist.</div>';
    return;
  }
  listEl.innerHTML = evs.map((e, idx) => {
    const icon = e.type === 'goal' ? '<span class="goal-icon">⚽</span>' : '<span class="assist-icon">🎯</span>';
    const label = e.type === 'goal' ? 'Gol' : 'Assist';
    return `<div>${icon} <b>${e.player}</b> (${label}) — ${TEAMS[e.team]}
      <button class="btn-red btn-sm" style="float:right" onclick="removeEvent('${key}',${idx})">x</button></div>`;
  }).join("");
}

/* ================== UBAH SKOR MANUAL ================== */
function updateScore(key, side, val) {
  const v = Math.max(0, parseInt(val) || 0);
  state.scores[key][side] = v;
  state.scores[key].played = true;
  saveState();
  renderAll();
}

/* ================== TAMBAH EVENT ================== */
function addEvent(key) {
  const type = document.getElementById("type-" + key).value;
  const team = parseInt(document.getElementById("team-" + key).value);
  const player = document.getElementById("player-" + key).value.trim();
  if (!player) { alert("Nama pemain harus diisi!"); return; }

  const evs = state.events[key] || [];
  evs.push({ type, team, player });
  state.events[key] = evs;

  if (type === "goal") {
    const [i, j] = key.split("-").map(Number);
    if (team === i) state.scores[key].a += 1;
    else state.scores[key].b += 1;
    state.scores[key].played = true;
  }

  saveState();
  renderAll();
  document.getElementById("player-" + key).value = "";
}

function removeEvent(key, idx) {
  const evs = state.events[key];
  const e = evs[idx];
  if (e.type === "goal") {
    const [i, j] = key.split("-").map(Number);
    if (e.team === i) state.scores[key].a = Math.max(0, state.scores[key].a - 1);
    else state.scores[key].b = Math.max(0, state.scores[key].b - 1);
  }
  evs.splice(idx, 1);
  saveState();
  renderAll();
}

/* ================== HITUNG KLASEMEN ================== */
function computeStandings() {
  const stats = TEAMS.map((name, idx) => ({
    idx, name, mp:0, m:0, s:0, k:0, gm:0, gk:0, sg:0, poin:0
  }));

  FIXTURES.forEach(([i,j]) => {
    const key = i + "-" + j;
    const sc = state.scores[key];
    if (!sc.played) return;
    const a = sc.a, b = sc.b;
    stats[i].mp++; stats[j].mp++;
    stats[i].gm += a; stats[i].gk += b;
    stats[j].gm += b; stats[j].gk += a;

    if (a > b) { stats[i].m++; stats[j].k++; stats[i].poin += 3; }
    else if (b > a) { stats[j].m++; stats[i].k++; stats[j].poin += 3; }
    else { stats[i].s++; stats[j].s++; stats[i].poin++; stats[j].poin++; }
  });

  stats.forEach(t => t.sg = t.gm - t.gk);

  stats.sort((x, y) => {
    if (y.poin !== x.poin) return y.poin - x.poin;
    if (y.sg !== x.sg) return y.sg - x.sg;
    if (y.gm !== x.gm) return y.gm - x.gm;
    const h2h = headToHead(x.idx, y.idx);
    if (h2h !== 0) return h2h;
    return x.name.localeCompare(y.name);
  });

  return stats;
}

function headToHead(aIdx, bIdx) {
  let key = null, aIsFirst = true;
  FIXTURES.forEach(([i,j]) => {
    if (i === aIdx && j === bIdx) { key = i + "-" + j; aIsFirst = true; }
    if (i === bIdx && j === aIdx) { key = i + "-" + j; aIsFirst = false; }
  });
  if (!key) return 0;
  const sc = state.scores[key];
  if (!sc.played) return 0;
  const aScore = aIsFirst ? sc.a : sc.b;
  const bScore = aIsFirst ? sc.b : sc.a;
  if (aScore > bScore) return -1;
  if (aScore < bScore) return 1;
  return 0;
}

/* ================== RENDER KLASEMEN ================== */
function renderStandings() {
  const stats = computeStandings();
  const tbody = document.querySelector("#klasemen tbody");
  tbody.innerHTML = stats.map((t, i) => `
    <tr>
      <td class="pos">${i+1}</td>
      <td class="team-name">${logoHTML(t.idx)}${t.name}</td>
      <td>${t.mp}</td><td>${t.m}</td><td>${t.s}</td><td>${t.k}</td>
      <td>${t.gm}</td><td>${t.gk}</td>
      <td>${t.sg > 0 ? '+' + t.sg : t.sg}</td>
      <td style="color:#f5e07a;font-weight:800;">${t.poin}</td>
    </tr>
  `).join("");
}

/* ================== TOP SKOR & TOP ASSIST ================== */
function computePlayerStats() {
  const goals = {}, assists = {};
  Object.keys(state.events).forEach(key => {
    state.events[key].forEach(e => {
      const k = e.player + "||" + e.team;
      if (e.type === "goal") goals[k] = (goals[k] || 0) + 1;
      else if (e.type === "assist") assists[k] = (assists[k] || 0) + 1;
    });
  });
  const toArr = (obj) => Object.keys(obj).map(k => {
    const [name, teamIdx] = k.split("||");
    return { name, teamIdx: parseInt(teamIdx), team: TEAMS[parseInt(teamIdx)], count: obj[k] };
  }).sort((a,b) => b.count - a.count || a.name.localeCompare(b.name));
  return { goals: toArr(goals), assists: toArr(assists) };
}

function renderTopScorers() {
  const { goals } = computePlayerStats();
  const el = document.getElementById("topScorers");
  if (goals.length === 0) {
    el.innerHTML = '<div style="color:#7fa5d0;padding:8px;">Belum ada gol tercatat.</div>';
    return;
  }
  el.innerHTML = goals.map((p, i) => `
    <div class="top-scorer-item">
      <div class="rank">${i+1}</div>
      <div class="name">${p.name}
        <div class="team">${logoHTML(p.teamIdx)}${p.team}</div>
      </div>
      <div class="count">${p.count} ⚽</div>
    </div>
  `).join("");
}

function renderTopAssists() {
  const { assists } = computePlayerStats();
  const el = document.getElementById("topAssists");
  if (assists.length === 0) {
    el.innerHTML = '<div style="color:#7fa5d0;padding:8px;">Belum ada assist tercatat.</div>';
    return;
  }
  el.innerHTML = assists.map((p, i) => `
    <div class="top-scorer-item">
      <div class="rank">${i+1}</div>
      <div class="name">${p.name}
        <div class="team">${logoHTML(p.teamIdx)}${p.team}</div>
      </div>
      <div class="count">${p.count} 🎯</div>
    </div>
  `).join("");
}

/* ================== RESET ================== */
function resetAll() {
  if (!confirm("Yakin ingin menghapus semua data skor & pencetak gol?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = defaultState();
  renderAll();
}

function renderAll() {
  renderMatches();
  renderStandings();
  renderTopScorers();
  renderTopAssists();
}

renderAll();
</script>
</body>
</html>
